version: 2

models:

  - name: air_quality_clean
    description: "Cleaned city-level air quality data with NaN values converted to NULL."

    columns:

      - name: City
        description: "City name"
        tests:
          - not_null

      - name: Date
        description: "Observation date"
        tests:
          - not_null

      - name: PM25
        description: "PM2.5 concentration"

      - name: PM10
        description: "PM10 concentration"

      - name: "NO"
        description: "Nitric oxide concentration"

      - name: NO2
        description: "Nitrogen dioxide concentration"

      - name: NOx
        description: "Nitrogen oxides concentration"

      - name: NH3
        description: "Ammonia concentration"

      - name: CO
        description: "Carbon monoxide concentration"

      - name: SO2
        description: "Sulfur dioxide concentration"

      - name: O3
        description: "Ozone concentration"

      - name: AQI
        description: "Air Quality Index. NULL values allowed when unavailable."

      - name: AQI_Bucket
        description: "AQI category classification"
